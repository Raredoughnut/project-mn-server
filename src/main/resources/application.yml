spring:
  application:
    name: mnarchive

  datasource:
    url: jdbc:postgresql://localhost:5432/mnarchive
    username: ${DB_USER:mnarchive}
    password: ${DB_PASSWORD:mnarchive}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 가 손대지 못하게 한다.
      ddl-auto: validate
    open-in-view: false        # 컨트롤러에서 lazy 로딩이 터지는 것을 방지
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

app:
  # 북마클릿이 로드할 스크립트 주소.
  #
  # jsDelivr 이 GitHub 저장소를 그대로 서빙한다 — 저장소가 public 이라 별도 인프라도 업로드
  # 절차도 없다. 배포 = git push. (cdn.raredonut.com 은 DNS 에 존재한 적이 없다.)
  #
  # @main 은 브랜치를 가리켜 jsDelivr 이 최대 7일까지 캐시한다. 북마클릿에 ?v=Date.now() 가
  # 붙어 브라우저 캐시는 우회되지만 엣지 캐시는 별개다. 즉시 반영이 필요하면 커밋 해시를
  # 고정할 것: .../project-mn-server@<commit>/scripts/popn-sync.js
  #
  # 스크립트를 고치는 중이라면 로컬로 덮어써서 푸시 없이 확인한다:
  #   cd scripts && python3 -m http.server 9000
  #   APP_CDN_URL=http://localhost:9000/popn-sync.js
  cdn-url: ${APP_CDN_URL:https://cdn.jsdelivr.net/gh/Raredoughnut/project-mn-server@main/scripts/popn-sync.js}

  # 북마클릿이 스코어를 POST 할 주소.
  # 이 값은 발급 시점에 북마클릿 문자열 안에 그대로 박힌다 — 나중에 서버 설정을 고쳐도
  # 이미 즐겨찾기에 저장된 북마클릿은 옛 주소를 계속 쓴다. 운영 배포에 APP_API_BASE 를
  # 빠뜨리면 사용자에게 localhost 를 가리키는 북마클릿이 나가고, 재발급 전까지 복구되지 않는다.
  # 운영: APP_API_BASE=https://api.raredonut.com
  api-base: ${APP_API_BASE:http://localhost:8080}
  # 로그인/로그아웃 후 돌아갈 프론트 주소. 배포 시 FRONTEND_URL 환경변수로 덮어쓴다
  # (운영: https://mn.raredonut.com)
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # CORS 허용 오리진. 보통은 프론트가 하나뿐이라 frontend-url 을 그대로 따라간다.
  # 프리뷰 배포처럼 오리진이 여러 개 필요할 때만 CORS_ALLOWED_ORIGINS 에 쉼표로 나열한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

  # CSRF 토큰 쿠키의 도메인. 프론트가 이 쿠키를 읽어 헤더로 되돌려줘야 상태 변경 요청이 통한다.
  # 로컬은 프론트·백엔드가 둘 다 localhost 라 비워 두면 되고(쿠키는 포트를 구분하지 않는다),
  # 운영은 mn.raredonut.com 이 api.raredonut.com 의 쿠키를 읽어야 하므로 상위 도메인이 필요하다.
  # 운영: APP_COOKIE_DOMAIN=raredonut.com
  cookie-domain: ${APP_COOKIE_DOMAIN:}

  # API 문서 노출 여부. 개발 편의를 위해 기본은 켜 두고, 운영에서는 API_DOCS_ENABLED=false 로 끈다.
  # 접근을 인증으로 조이는 대신 엔드포인트 자체를 없앤다 — 지금은 구글 계정만 있으면 누구나
  # 로그인되므로(가입 allowlist 없음) authenticated() 로는 실질적인 보호가 되지 않는다.
  # springdoc 과 SecurityConfig 가 이 값 하나를 함께 본다.
  api-docs-enabled: ${API_DOCS_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${app.api-docs-enabled}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${app.api-docs-enabled}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    org.springframework.jdbc.core: INFO
