spring:
  application:
    name: mnarchive

  datasource:
    url: jdbc:postgresql://localhost:5432/mnarchive
    username: ${DB_USER:mnarchive}
    password: ${DB_PASSWORD:mnarchive}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 가 손대지 못하게 한다.
      ddl-auto: validate
    open-in-view: false        # 컨트롤러에서 lazy 로딩이 터지는 것을 방지
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

app:
  cdn-url: https://cdn.raredonut.com/popn-sync.js
  api-base: https://api.raredonut.com
  # 로그인/로그아웃 후 돌아갈 프론트 주소. 배포 시 FRONTEND_URL 환경변수로 덮어쓴다
  # (운영: https://mn.raredonut.com)
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    org.springframework.jdbc.core: INFO
